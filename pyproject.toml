[project]
name = "llama-index-wity"
version = "0.2.0"
description = "LlamaIndex integration for Wity, the typed-decision API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["wity", "llama-index", "llamaindex", "typed-decisions", "classification", "router", "agents"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "llama-index-core>=0.14.12,<0.15",
    "wity-sdk>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://wity.alphanimble.com"
Documentation = "https://wity.alphanimble.com/docs/api"
Repository = "https://github.com/info-alphanimble/llama-index-wity"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Our folder is also called wity. The SDK is still a third-party package.
known-third-party = ["wity"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No network in tests. Live tests turn it back on for themselves.
addopts = "--disable-socket --allow-unix-socket"
# LlamaIndex's FunctionAgent reads deprecated pydantic attributes when it starts. Not our code.
filterwarnings = [
    "ignore::DeprecationWarning:inspect",
    "ignore:is_running called from within a step:DeprecationWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]
